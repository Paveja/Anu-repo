revolte:
  version: '1'
  project: New proj
  appName: Griddd
  env:
    preview:
      services:
        rid_1:
          name: griddd
          type: WEB_SERVICE
          entryPoint: .next/standalone/server.js
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
            variables:
              NODE_ENV: production
              PORT: '8080'
    qa:
      branch: qa
      services:
        rid_1:
          name: griddd
          type: WEB_SERVICE
          entryPoint: .next/standalone/server.js
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
    staging:
      branch: staging
      services:
        rid_1:
          name: griddd
          type: WEB_SERVICE
          entryPoint: .next/standalone/server.js
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
    production:
      branch: main
      services:
        rid_1:
          name: griddd
          type: WEB_SERVICE
          entryPoint: .next/standalone/server.js
          specifications:
            cpu: 2
            memory: 2
            storage: 50
            autoScaling:
              replica:
                min: 1
                max: 3
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
