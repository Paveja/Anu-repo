revolte:
  version: '1'
  project: New project
  appName: wiudsj
  env:
    preview:
      services:
        rid_1:
          name: wiudsj
          type: WEB_SERVICE
          entryPoint: src/app/layout.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
            variables:
              NODE_ENV: production
              PORT: '8080'
              DATABASE_URL: 'file:./dev.db'
              AUTH_SECRET: '#{AUTH_SECRET}'
    qa:
      branch: qa
      services:
        rid_1:
          name: wiudsj
          type: WEB_SERVICE
          entryPoint: src/app/layout.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
    staging:
      branch: staging
      services:
        rid_1:
          name: wiudsj
          type: WEB_SERVICE
          entryPoint: src/app/layout.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
    production:
      branch: main
      services:
        rid_1:
          name: wiudsj
          type: WEB_SERVICE
          entryPoint: src/app/layout.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 50
            autoScaling:
              replica:
                min: 1
                max: 3
          properties:
            port: 8080
            health: /health
            loadBalancerMode: shared
